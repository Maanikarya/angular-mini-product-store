<div class="product-card">

    <img
        [src]="product.image"
        [alt]="product.title">

    <h3>{{ product.title }}</h3>

    <p class="price">
        {{ product.price | currency:'INR' }}
    </p>

    <p class="category">
        {{ product.category }}
    </p>

    <a
        [routerLink]="['/products', product.id]"
        class="details-btn">
        View Details
    </a>

    <button
        (click)="addToCart()">
        Add To Cart
    </button>

</div>
